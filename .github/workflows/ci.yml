name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "test-token"
      TG_API_ID: "123456"
      TG_API_HASH: "00000000000000000000000000000000"
      ADMIN_IDS: "123456789"
      DATABASE_URL: "postgresql+asyncpg://tg_bot:change_me@127.0.0.1:5432/tg_account_bot"
      FERNET_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      MINI_APP_ENABLED: "false"
      LOGIN_EMAIL_PROTECTION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app tests alembic
